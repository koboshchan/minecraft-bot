services:
  bot:
    build:
      context: .
    image: ghcr.io/koboshchan/minecraft-bot:main
    environment:
      SERVER_IP: ${SERVER_IP}
      ADMIN: ${ADMIN}
      CENTER_BOT_NAME: ${CENTER_BOT_NAME:-command-center}
      AUTH_ANYWAYS: ${AUTH_ANYWAYS:-0}
    restart: unless-stopped
    volumes:
      - ./settings:/app/settings