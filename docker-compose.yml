services:
  builder:
    build:
      context: .
      target: builder
    image: minecraft-bot:builder
    command: ["npm", "ci", "--omit=dev"]

  runner:
    build:
      context: .
      target: runner
    image: minecraft-bot:runner
    environment:
      SERVER_IP: ${SERVER_IP}
      ADMIN: ${ADMIN}
      CENTER_BOT_NAME: ${CENTER_BOT_NAME:-command-center}
    restart: unless-stopped
    depends_on:
      - builder
